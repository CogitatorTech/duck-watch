services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/cogitatortech/duck-watch-backend:${DUCKWATCH_VERSION:-latest}
    environment:
      PORT: 8080
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      CORS_ORIGINS: "*"
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres?sslmode=disable
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      INGEST_POLL_INTERVAL_SECONDS: 60
      INGEST_OVERLAP_MINUTES: 15
      INGEST_BATCH_LIMIT: 5000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/cogitatortech/duck-watch-web:${DUCKWATCH_VERSION:-latest}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db:
    driver: local
