# Builds both images from the working tree instead of pulling the published ones.
# Use it with:
#
#   docker compose -f compose.yml -f compose.dev.yml up -d --build
#
# or run `make start-dev`, which does the same thing.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

  web:
    build:
      context: ./web
