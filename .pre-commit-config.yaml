default_stages: [ pre-push ]
fail_fast: false
exclude: '^(web/package-lock\.json|web/build/|docs/assets/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-json

  - repo: local
    hooks:
      - id: format
        name: Format Rust Code
        entry: make format
        language: system
        pass_filenames: false
        stages: [ pre-commit ]

      - id: lint
        name: Lint Rust Code
        entry: make lint
        language: system
        pass_filenames: false
        stages: [ pre-commit ]

      - id: test
        name: Run Rust Tests
        entry: make test
        language: system
        pass_filenames: false
